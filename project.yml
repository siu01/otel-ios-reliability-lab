name: OTelReliabilityLab

options:
  bundleIdPrefix: dev.siu01
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ReliabilityCore:
    path: Packages/ReliabilityCore
  OpenTelemetrySwift:
    url: https://github.com/open-telemetry/opentelemetry-swift.git
    exactVersion: 2.5.0
  OpenTelemetryCore:
    url: https://github.com/open-telemetry/opentelemetry-swift-core.git
    exactVersion: 2.5.1

settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO

targets:
  OTelReliabilityLab:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    resources:
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Span Survival Lab
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.siu01.otel-reliability-lab
        PRODUCT_NAME: OTelReliabilityLab
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: ReliabilityCore
      - package: OpenTelemetryCore
        product: OpenTelemetryApi
      - package: OpenTelemetryCore
        product: OpenTelemetrySdk
      - package: OpenTelemetrySwift
        product: OpenTelemetryProtocolExporterHTTP
      - package: OpenTelemetrySwift
        product: PersistenceExporter
      - package: OpenTelemetrySwift
        product: URLSessionInstrumentation

schemes:
  OTelReliabilityLab:
    build:
      targets:
        OTelReliabilityLab: all
    run:
      config: Debug
    test:
      config: Debug

