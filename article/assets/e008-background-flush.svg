<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">E008 real iOS background flush comparison</title>
  <desc id="description">Without flush, default and instant persistence recover zero of one hundred spans. Provider force flush from a real SwiftUI background callback creates a file in 45 to 52 milliseconds and both recover all one hundred spans after abrupt restart.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d2b"/>
      <stop offset="1" stop-color="#03070c"/>
    </linearGradient>
    <linearGradient id="loss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#115e59"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <circle cx="1120" cy="65" r="185" fill="#2dd4bf" opacity="0.055"/>
  <circle cx="70" cy="610" r="180" fill="#ef4444" opacity="0.05"/>

  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="72" y="72" fill="#f8fafc" font-size="34" font-weight="750">実バックグラウンドflushで、回収0件 → 100件</text>
    <text x="73" y="110" fill="#94a3b8" font-size="18">E008 • SwiftUI scenePhase.background • 5秒batch schedule • 直後にSIGKILL</text>

    <!-- no-flush panel -->
    <rect x="72" y="151" width="435" height="306" rx="22" fill="url(#loss)" stroke="#ef4444" stroke-opacity="0.45"/>
    <text x="102" y="194" fill="#fecaca" font-size="22" font-weight="700">background通知のみ</text>
    <text x="102" y="223" fill="#fca5a5" font-size="15">provider forceFlushなし</text>

    <line x1="102" y1="247" x2="477" y2="247" stroke="#fca5a5" stroke-opacity="0.25"/>
    <text x="104" y="286" fill="#f8fafc" font-size="20" font-weight="650">Default</text>
    <text x="278" y="286" fill="#fca5a5" font-size="14">file 0</text>
    <text x="446" y="291" fill="#fff1f2" font-size="38" font-weight="800" text-anchor="end">0/100</text>

    <line x1="102" y1="315" x2="477" y2="315" stroke="#fca5a5" stroke-opacity="0.18"/>
    <text x="104" y="355" fill="#f8fafc" font-size="20" font-weight="650">Instant</text>
    <text x="278" y="355" fill="#fca5a5" font-size="14">file 0</text>
    <text x="446" y="360" fill="#fff1f2" font-size="38" font-weight="800" text-anchor="end">0/100</text>

    <rect x="101" y="387" width="377" height="45" rx="12" fill="#020617" opacity="0.54"/>
    <text x="289" y="415" fill="#fca5a5" font-size="15" text-anchor="middle">終了済みspanはbatch memoryに残ったまま</text>

    <!-- intervention arrow -->
    <path d="M528 289 H641 L624 270 M641 289 L624 308" fill="none" stroke="url(#arrow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="584" y="245" fill="#fde68a" font-size="15" font-weight="700" text-anchor="middle">scenePhaseで</text>
    <text x="584" y="264" fill="#fde68a" font-size="15" font-weight="700" text-anchor="middle">forceFlush</text>

    <!-- flush panel -->
    <rect x="663" y="151" width="465" height="306" rx="22" fill="url(#success)" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="693" y="194" fill="#ccfbf1" font-size="22" font-weight="700">background通知からflush</text>
    <text x="693" y="223" fill="#99f6e4" font-size="15">flush完了eventを観測してから停止</text>

    <line x1="693" y1="247" x2="1098" y2="247" stroke="#99f6e4" stroke-opacity="0.25"/>
    <text x="695" y="286" fill="#f8fafc" font-size="20" font-weight="650">Default</text>
    <text x="835" y="280" fill="#99f6e4" font-size="14">45.32ms</text>
    <text x="835" y="300" fill="#5eead4" font-size="13">file 1</text>
    <text x="1070" y="291" fill="#ecfeff" font-size="38" font-weight="800" text-anchor="end">100/100</text>

    <line x1="693" y1="315" x2="1098" y2="315" stroke="#99f6e4" stroke-opacity="0.18"/>
    <text x="695" y="355" fill="#f8fafc" font-size="20" font-weight="650">Instant</text>
    <text x="835" y="349" fill="#99f6e4" font-size="14">51.39ms</text>
    <text x="835" y="369" fill="#5eead4" font-size="13">file 1</text>
    <text x="1070" y="360" fill="#ecfeff" font-size="38" font-weight="800" text-anchor="end">100/100</text>

    <rect x="692" y="387" width="406" height="45" rx="12" fill="#020617" opacity="0.50"/>
    <text x="895" y="415" fill="#99f6e4" font-size="15" text-anchor="middle">再起動後、各1 request・重複0で回収</text>

    <!-- timeline -->
    <rect x="72" y="490" width="1056" height="116" rx="18" fill="#0f172a" stroke="#334155"/>
    <line x1="133" y1="547" x2="1057" y2="547" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <g text-anchor="middle">
      <circle cx="141" cy="547" r="11" fill="#f8fafc"/>
      <text x="141" y="527" fill="#e2e8f0" font-size="14">台帳100件</text>
      <text x="141" y="580" fill="#94a3b8" font-size="12">batch memory</text>

      <circle cx="391" cy="547" r="11" fill="#f59e0b" filter="url(#glow)"/>
      <text x="391" y="527" fill="#fde68a" font-size="14">実background通知</text>
      <text x="391" y="580" fill="#94a3b8" font-size="12">台帳後 1.74–2.56秒</text>

      <circle cx="625" cy="547" r="11" fill="#2dd4bf" filter="url(#glow)"/>
      <text x="625" y="527" fill="#99f6e4" font-size="14">flush完了</text>
      <text x="625" y="580" fill="#94a3b8" font-size="12">45–52msでfile化</text>

      <circle cx="827" cy="547" r="11" fill="#ef4444"/>
      <text x="827" y="527" fill="#fecaca" font-size="14">direct SIGKILL</text>
      <text x="827" y="580" fill="#94a3b8" font-size="12">Collector停止中</text>

      <circle cx="1050" cy="547" r="11" fill="#2dd4bf"/>
      <text x="1050" y="527" fill="#99f6e4" font-size="14">relaunch</text>
      <text x="1050" y="580" fill="#94a3b8" font-size="12">exact 100/100</text>
    </g>

    <text x="600" y="644" fill="#64748b" font-size="13" text-anchor="middle">iPhone 17 Simulator / iOS 26.4.1 • 各条件1 run • 実端末のsuspension・jetsam保証ではない</text>
  </g>
</svg>
