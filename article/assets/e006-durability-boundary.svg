<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">E006 abrupt-stop durability boundary</title>
  <desc id="description">Default and instant persistence both recover zero spans at short host-observed stop intervals and all one hundred spans after a persistence file is visible around 330 milliseconds.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d2b"/>
      <stop offset="1" stop-color="#03070c"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="loss" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#fca5a5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="100" r="190" fill="#2dd4bf" opacity="0.05"/>
  <circle cx="80" cy="610" r="190" fill="#ef4444" opacity="0.05"/>

  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="72" y="76" fill="#f8fafc" font-size="34" font-weight="700">span.end()済みでも、ファイル前に止めると0件</text>
    <text x="73" y="114" fill="#94a3b8" font-size="18">E006 • direct SIGKILL • 100 logical spans • explicit flushなし</text>

    <!-- observation area -->
    <rect x="154" y="160" width="470" height="330" rx="18" fill="#ef4444" opacity="0.035"/>
    <rect x="624" y="160" width="383" height="330" rx="18" fill="#f8fafc" opacity="0.025" stroke="#64748b" stroke-dasharray="6 8"/>
    <rect x="1007" y="160" width="80" height="330" rx="18" fill="#2dd4bf" opacity="0.05"/>
    <text x="389" y="187" fill="#fca5a5" font-size="15" text-anchor="middle">観測したloss側</text>
    <text x="815" y="187" fill="#94a3b8" font-size="15" text-anchor="middle">未観測の遷移帯</text>
    <text x="1047" y="187" fill="#99f6e4" font-size="15" text-anchor="middle">durable側</text>

    <!-- reference line: 250 ms -->
    <line x1="804" y1="202" x2="804" y2="490" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 7" opacity="0.8"/>
    <text x="804" y="213" fill="#fbbf24" font-size="14" text-anchor="middle">scheduleDelay 250ms</text>
    <text x="804" y="231" fill="#fbbf24" font-size="12" text-anchor="middle">参考線</text>

    <!-- row labels and baselines -->
    <text x="133" y="290" fill="#cbd5e1" font-size="19" font-weight="650" text-anchor="end">Default</text>
    <text x="133" y="423" fill="#cbd5e1" font-size="19" font-weight="650" text-anchor="end">Instant</text>
    <line x1="154" y1="283" x2="1087" y2="283" stroke="#334155" stroke-width="2"/>
    <line x1="154" y1="416" x2="1087" y2="416" stroke="#334155" stroke-width="2"/>

    <!-- default: loss at 14, 55, 73, 181 ms -->
    <g fill="url(#loss)" filter="url(#glow)">
      <circle cx="190" cy="283" r="13"/>
      <circle cx="297" cy="283" r="13"/>
      <circle cx="344" cy="283" r="13"/>
      <circle cx="625" cy="283" r="13"/>
    </g>
    <g fill="#fecaca" font-size="15" font-weight="700" text-anchor="middle">
      <text x="190" y="258">0/100</text>
      <text x="297" y="258">0/100</text>
      <text x="344" y="316">0/100</text>
      <text x="625" y="258">0/100</text>
    </g>
    <g fill="#94a3b8" font-size="13" text-anchor="middle">
      <text x="190" y="337">14ms</text>
      <text x="297" y="337">55ms</text>
      <text x="344" y="355">73ms</text>
      <text x="625" y="337">181ms</text>
    </g>

    <!-- default durable at 331 ms -->
    <rect x="1002" y="265" width="34" height="34" rx="9" fill="url(#success)" filter="url(#glow)"/>
    <text x="1019" y="249" fill="#99f6e4" font-size="16" font-weight="700" text-anchor="middle">100/100</text>
    <text x="1019" y="337" fill="#94a3b8" font-size="13" text-anchor="middle">331ms</text>

    <!-- instant: loss at 19 ms, durable at 328 ms -->
    <circle cx="203" cy="416" r="13" fill="url(#loss)" filter="url(#glow)"/>
    <text x="203" y="391" fill="#fecaca" font-size="15" font-weight="700" text-anchor="middle">0/100</text>
    <text x="203" y="462" fill="#94a3b8" font-size="13" text-anchor="middle">19ms</text>

    <rect x="994" y="399" width="34" height="34" rx="9" fill="url(#success)" filter="url(#glow)"/>
    <text x="1011" y="383" fill="#99f6e4" font-size="16" font-weight="700" text-anchor="middle">100/100</text>
    <text x="1011" y="462" fill="#94a3b8" font-size="13" text-anchor="middle">328ms</text>

    <!-- x axis -->
    <line x1="154" y1="510" x2="1087" y2="510" stroke="#64748b" stroke-width="2"/>
    <g fill="#94a3b8" font-size="14" text-anchor="middle">
      <line x1="154" y1="506" x2="154" y2="518" stroke="#64748b"/><text x="154" y="540">0</text>
      <line x1="414" y1="506" x2="414" y2="518" stroke="#64748b"/><text x="414" y="540">100</text>
      <line x1="674" y1="506" x2="674" y2="518" stroke="#64748b"/><text x="674" y="540">200</text>
      <line x1="934" y1="506" x2="934" y2="518" stroke="#64748b"/><text x="934" y="540">300</text>
      <text x="620" y="568" fill="#cbd5e1" font-size="16">生成台帳を観測してからSIGKILL要求までの実測時間（ms）</text>
    </g>

    <!-- calibration and legend -->
    <rect x="70" y="588" width="1060" height="55" rx="14" fill="#0f172a" stroke="#334155"/>
    <circle cx="98" cy="616" r="9" fill="url(#loss)"/>
    <text x="117" y="621" fill="#cbd5e1" font-size="14">file 0 → recovered 0</text>
    <rect x="298" y="607" width="18" height="18" rx="5" fill="url(#success)"/>
    <text x="327" y="621" fill="#cbd5e1" font-size="14">file 1 → recovered 100</text>
    <text x="560" y="621" fill="#94a3b8" font-size="13">校正: simctl terminateは停止に471msかかり、その間にfileが完成 → 100/100</text>
  </g>
</svg>
