<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">E016 provider flush and measured main-queue delay</title>
  <desc id="description">Four background flush conditions show that already-enqueued main-queue work resumed 224 to 303 milliseconds after the provider flush duration, and the Instant binary condition exceeded one second despite a sub-second provider call.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d2b"/>
      <stop offset="1" stop-color="#03070c"/>
    </linearGradient>
    <linearGradient id="flush" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="unmeasured" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="1115" cy="30" r="190" fill="#2dd4bf" opacity="0.05"/>
  <circle cx="45" cy="650" r="180" fill="#f59e0b" opacity="0.04"/>

  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="70" y="68" fill="#f8fafc" font-size="34" font-weight="750">flushが終わっても、main queueは戻っていなかった</text>
    <text x="71" y="105" fill="#94a3b8" font-size="18">E016 • scenePhase.background • 500 spans • すでにenqueue済みの処理が再開するまで</text>

    <rect x="70" y="135" width="1060" height="390" rx="22" fill="#0f172a" stroke="#334155"/>

    <rect x="760" y="158" width="18" height="18" rx="5" fill="url(#flush)"/>
    <text x="787" y="172" fill="#cbd5e1" font-size="13">provider forceFlush</text>
    <rect x="932" y="158" width="18" height="18" rx="5" fill="url(#unmeasured)"/>
    <text x="959" y="172" fill="#cbd5e1" font-size="13">その後のqueue遅延</text>

    <!-- axis -->
    <path d="M260 194 V472 M414 194 V472 M568 194 V472 M721 194 V472 M875 194 V472 M1029 194 V472" stroke="#334155" stroke-width="1" stroke-dasharray="4 6"/>
    <text x="260" y="497" fill="#64748b" font-size="12" text-anchor="middle">0</text>
    <text x="414" y="497" fill="#64748b" font-size="12" text-anchor="middle">250</text>
    <text x="568" y="497" fill="#64748b" font-size="12" text-anchor="middle">500</text>
    <text x="721" y="497" fill="#64748b" font-size="12" text-anchor="middle">750</text>
    <text x="875" y="497" fill="#64748b" font-size="12" text-anchor="middle">1,000</text>
    <text x="1029" y="497" fill="#64748b" font-size="12" text-anchor="middle">1,250 ms</text>

    <!-- default native -->
    <text x="101" y="232" fill="#e2e8f0" font-size="16" font-weight="700">Default</text>
    <text x="101" y="252" fill="#64748b" font-size="12">SDK native • batch 100</text>
    <rect x="260" y="215" width="45" height="43" rx="9" fill="url(#flush)"/>
    <rect x="305" y="215" width="138" height="43" rx="9" fill="url(#unmeasured)"/>
    <text x="455" y="241" fill="#f8fafc" font-size="16" font-weight="800">297 ms</text>
    <text x="282" y="276" fill="#5eead4" font-size="11" text-anchor="middle">73</text>
    <text x="374" y="276" fill="#fbbf24" font-size="11" text-anchor="middle">+224</text>

    <!-- instant native -->
    <text x="101" y="303" fill="#e2e8f0" font-size="16" font-weight="700">Instant</text>
    <text x="101" y="323" fill="#64748b" font-size="12">SDK native • batch 100</text>
    <rect x="260" y="286" width="79" height="43" rx="9" fill="url(#flush)"/>
    <rect x="339" y="286" width="151" height="43" rx="9" fill="url(#unmeasured)"/>
    <text x="502" y="312" fill="#f8fafc" font-size="16" font-weight="800">374 ms</text>
    <text x="299" y="347" fill="#5eead4" font-size="11" text-anchor="middle">129</text>
    <text x="414" y="347" fill="#fbbf24" font-size="11" text-anchor="middle">+245</text>

    <!-- default binary -->
    <text x="101" y="374" fill="#e2e8f0" font-size="16" font-weight="700">Default</text>
    <text x="101" y="394" fill="#64748b" font-size="12">byte-aware binary • batch 256</text>
    <rect x="260" y="357" width="293" height="43" rx="9" fill="url(#flush)"/>
    <rect x="553" y="357" width="140" height="43" rx="9" fill="url(#unmeasured)"/>
    <text x="705" y="383" fill="#f8fafc" font-size="16" font-weight="800">703 ms</text>
    <text x="406" y="418" fill="#5eead4" font-size="11" text-anchor="middle">476</text>
    <text x="623" y="418" fill="#fbbf24" font-size="11" text-anchor="middle">+227</text>

    <!-- instant binary -->
    <text x="101" y="445" fill="#e2e8f0" font-size="16" font-weight="700">Instant</text>
    <text x="101" y="465" fill="#64748b" font-size="12">byte-aware binary • batch 256</text>
    <rect x="260" y="428" width="596" height="43" rx="9" fill="url(#flush)"/>
    <rect x="856" y="428" width="186" height="43" rx="9" fill="url(#unmeasured)" filter="url(#glow)"/>
    <text x="1055" y="454" fill="#fef3c7" font-size="16" font-weight="800">1,271 ms</text>
    <text x="558" y="489" fill="#5eead4" font-size="11" text-anchor="middle">968</text>
    <text x="949" y="489" fill="#fbbf24" font-size="11" text-anchor="middle">+303</text>

    <rect x="70" y="550" width="1060" height="78" rx="18" fill="#111827" stroke="#475569"/>
    <text x="101" y="580" fill="#99f6e4" font-size="17" font-weight="800">4 / 4 runs：500 / 500、duplicate 0</text>
    <text x="101" y="607" fill="#94a3b8" font-size="14">ただしflush時間だけでは224–303 msを見落とした。968 msのflushも、queue再開は1,271 ms後。</text>
    <text x="600" y="653" fill="#64748b" font-size="13" text-anchor="middle">Simulator単一run • visible frame latencyではなく、background callback中のqueued-work delay</text>
  </g>
</svg>
