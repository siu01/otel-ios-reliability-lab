<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">E010 safe export chunk recovery</title>
  <desc id="description">Reducing maximum export batch size from two hundred fifty-six to one hundred changes both persistence presets from zero to five hundred recovered spans and from two hundred thirty-two to one thousand recovered spans after real background flush and abrupt restart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d2b"/>
      <stop offset="1" stop-color="#03070c"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="change" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="1125" cy="60" r="190" fill="#2dd4bf" opacity="0.05"/>
  <circle cx="60" cy="630" r="175" fill="#f59e0b" opacity="0.045"/>

  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="70" y="72" fill="#f8fafc" font-size="34" font-weight="750">batch 256 → 100だけで、0 / 232件 → 全件回収</text>
    <text x="71" y="110" fill="#94a3b8" font-size="18">E009 → E010 • 同じbackground flush・同じSIGKILL・同じpayload</text>

    <!-- 500 comparison -->
    <rect x="70" y="150" width="510" height="310" rx="22" fill="#0f172a" stroke="#334155"/>
    <text x="101" y="192" fill="#e2e8f0" font-size="22" font-weight="700">500 spans</text>
    <text x="101" y="219" fill="#64748b" font-size="14">Default / Instantとも同じ結果</text>

    <text x="102" y="274" fill="#fca5a5" font-size="16" font-weight="700">batch 256</text>
    <rect x="207" y="247" width="323" height="38" rx="11" fill="#1e293b"/>
    <line x1="215" y1="254" x2="522" y2="278" stroke="#ef4444" stroke-width="4" opacity="0.75"/>
    <line x1="522" y1="254" x2="215" y2="278" stroke="#ef4444" stroke-width="4" opacity="0.75"/>
    <text x="515" y="274" fill="#fecaca" font-size="20" font-weight="800" text-anchor="end">0 / 500</text>

    <path d="M207 318 H530" stroke="url(#change)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M518 307 L530 318 L518 329" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <text x="369" y="308" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">maxExportBatchSizeだけ変更</text>

    <text x="102" y="382" fill="#99f6e4" font-size="16" font-weight="700">batch 100</text>
    <rect x="207" y="354" width="323" height="40" rx="11" fill="url(#success)"/>
    <text x="515" y="382" fill="#ecfeff" font-size="20" font-weight="800" text-anchor="end">500 / 500</text>

    <rect x="101" y="414" width="429" height="28" rx="9" fill="#042f2e"/>
    <text x="315" y="433" fill="#99f6e4" font-size="13" text-anchor="middle">5 objects → 1 file → 1 request • duplicate 0</text>

    <!-- 1000 comparison -->
    <rect x="620" y="150" width="510" height="310" rx="22" fill="#0f172a" stroke="#334155"/>
    <text x="651" y="192" fill="#e2e8f0" font-size="22" font-weight="700">1,000 spans</text>
    <text x="651" y="219" fill="#64748b" font-size="14">Default / Instantとも同じ結果</text>

    <text x="652" y="274" fill="#fca5a5" font-size="16" font-weight="700">batch 256</text>
    <rect x="757" y="247" width="323" height="38" rx="11" fill="#1e293b"/>
    <rect x="757" y="247" width="75" height="38" rx="11" fill="#7f1d1d"/>
    <text x="1065" y="274" fill="#fecaca" font-size="20" font-weight="800" text-anchor="end">232 / 1,000</text>

    <path d="M757 318 H1080" stroke="url(#change)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M1068 307 L1080 318 L1068 329" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <text x="919" y="308" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">maxExportBatchSizeだけ変更</text>

    <text x="652" y="382" fill="#99f6e4" font-size="16" font-weight="700">batch 100</text>
    <rect x="757" y="354" width="323" height="40" rx="11" fill="url(#success)"/>
    <text x="1065" y="382" fill="#ecfeff" font-size="20" font-weight="800" text-anchor="end">1,000 / 1,000</text>

    <rect x="651" y="414" width="429" height="28" rx="9" fill="#042f2e"/>
    <text x="865" y="433" fill="#99f6e4" font-size="13" text-anchor="middle">10 objects → 1 file → 1 request • duplicate 0</text>

    <!-- mechanism -->
    <rect x="70" y="493" width="1060" height="112" rx="20" fill="#111827" stroke="#475569"/>
    <text x="101" y="530" fill="#e2e8f0" font-size="17" font-weight="700">なぜ直った？</text>
    <g text-anchor="middle">
      <rect x="255" y="513" width="185" height="47" rx="12" fill="#451a03" stroke="#f59e0b"/>
      <text x="347" y="535" fill="#fde68a" font-size="14" font-weight="700">100-span object</text>
      <text x="347" y="552" fill="#fbbf24" font-size="12">encoded</text>

      <path d="M457 536 H534" stroke="#64748b" stroke-width="3"/>
      <path d="M524 527 L535 536 L524 545" fill="none" stroke="#64748b" stroke-width="3"/>

      <rect x="551" y="513" width="195" height="47" rx="12" fill="#042f2e" stroke="#2dd4bf"/>
      <text x="648" y="535" fill="#ccfbf1" font-size="14" font-weight="700">256 KiB未満</text>
      <text x="648" y="552" fill="#5eead4" font-size="12">writerへ到達</text>

      <path d="M763 536 H840" stroke="#64748b" stroke-width="3"/>
      <path d="M830 527 L841 536 L830 545" fill="none" stroke="#64748b" stroke-width="3"/>

      <rect x="858" y="513" width="210" height="47" rx="12" fill="#064e3b" stroke="#2dd4bf" filter="url(#glow)"/>
      <text x="963" y="535" fill="#ecfeff" font-size="14" font-weight="700">durable file</text>
      <text x="963" y="552" fill="#99f6e4" font-size="12">relaunchで全件</text>
    </g>
    <text x="600" y="587" fill="#94a3b8" font-size="13" text-anchor="middle">500件: flush 148–180ms ／ 1,000件: 80–169ms • post-flush待機なし</text>

    <text x="600" y="646" fill="#64748b" font-size="13" text-anchor="middle">100はこのpayloadでのmechanism proof。属性サイズが変われば安全境界も変わる</text>
  </g>
</svg>
