<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">E011 and E012 payload boundary and recovery</title>
  <desc id="description">With one hundred spans and batch size one hundred, increasing each payload from one thousand twenty-four to one thousand five hundred thirty-six bytes changes delivery from one hundred to zero. Splitting the same total payload into batches of fifty restores all one hundred spans for both persistence presets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d2b"/>
      <stop offset="1" stop-color="#03070c"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="1130" cy="45" r="190" fill="#2dd4bf" opacity="0.05"/>
  <circle cx="55" cy="635" r="175" fill="#ef4444" opacity="0.04"/>

  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="70" y="72" fill="#f8fafc" font-size="34" font-weight="750">同じ100 Span：属性+512Bで全損、chunk半分で全件回収</text>
    <text x="71" y="109" fill="#94a3b8" font-size="18">E011 → E012 • Default / Instantとも同じ境界</text>

    <!-- baseline -->
    <rect x="70" y="143" width="1060" height="83" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="102" y="178" fill="#cbd5e1" font-size="16" font-weight="700">batch 100</text>
    <text x="224" y="178" fill="#94a3b8" font-size="15">payload 1,024B / span</text>
    <rect x="438" y="158" width="263" height="34" rx="10" fill="url(#success)"/>
    <text x="685" y="181" fill="#ecfeff" font-size="18" font-weight="800" text-anchor="end">100 / 100</text>
    <text x="731" y="179" fill="#64748b" font-size="14">file 213.7KB</text>
    <text x="101" y="210" fill="#64748b" font-size="13">基準点：100件というcountではなく、encoded objectが256 KiB未満だから保存できた</text>

    <!-- failure panel -->
    <rect x="70" y="254" width="510" height="258" rx="22" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="101" y="294" fill="#fecaca" font-size="22" font-weight="750">E011 • payloadを増やす</text>
    <text x="101" y="321" fill="#94a3b8" font-size="14">100 spans • batch 100 • background flush完了</text>

    <rect x="101" y="349" width="448" height="62" rx="14" fill="#111827" stroke="#ef4444"/>
    <text x="124" y="376" fill="#fca5a5" font-size="15" font-weight="700">1,536B / span</text>
    <rect x="318" y="363" width="207" height="34" rx="10" fill="url(#danger)"/>
    <text x="510" y="386" fill="#fee2e2" font-size="19" font-weight="800" text-anchor="end">0 / 100</text>

    <rect x="101" y="422" width="448" height="62" rx="14" fill="#111827" stroke="#ef4444"/>
    <text x="124" y="449" fill="#fca5a5" font-size="15" font-weight="700">2,048B / span</text>
    <rect x="318" y="436" width="207" height="34" rx="10" fill="url(#danger)"/>
    <text x="510" y="459" fill="#fee2e2" font-size="19" font-weight="800" text-anchor="end">0 / 100</text>

    <text x="325" y="500" fill="#f87171" font-size="13" text-anchor="middle">file 0 • HTTP attempt 0 • flush latencyは成功時と同程度</text>

    <!-- recovery panel -->
    <rect x="620" y="254" width="510" height="258" rx="22" fill="#0f172a" stroke="#0f766e"/>
    <text x="651" y="294" fill="#ccfbf1" font-size="22" font-weight="750">E012 • chunkだけ半分にする</text>
    <text x="651" y="321" fill="#94a3b8" font-size="14">100 spans • batch 50 • payloadとlifecycleは同一</text>

    <rect x="651" y="349" width="448" height="62" rx="14" fill="#111827" stroke="#2dd4bf"/>
    <text x="674" y="376" fill="#99f6e4" font-size="15" font-weight="700">1,536B / span</text>
    <rect x="868" y="363" width="207" height="34" rx="10" fill="url(#success)" filter="url(#glow)"/>
    <text x="1060" y="386" fill="#ecfeff" font-size="19" font-weight="800" text-anchor="end">100 / 100</text>

    <rect x="651" y="422" width="448" height="62" rx="14" fill="#111827" stroke="#2dd4bf"/>
    <text x="674" y="449" fill="#99f6e4" font-size="15" font-weight="700">2,048B / span</text>
    <rect x="868" y="436" width="207" height="34" rx="10" fill="url(#success)" filter="url(#glow)"/>
    <text x="1060" y="459" fill="#ecfeff" font-size="19" font-weight="800" text-anchor="end">100 / 100</text>

    <text x="875" y="500" fill="#5eead4" font-size="13" text-anchor="middle">2 objects → 1 file → 1 request • duplicate 0</text>

    <!-- mechanism -->
    <rect x="70" y="541" width="1060" height="82" rx="18" fill="#111827" stroke="#475569"/>
    <g text-anchor="middle">
      <rect x="101" y="558" width="252" height="46" rx="12" fill="#450a0a" stroke="#ef4444"/>
      <text x="227" y="578" fill="#fecaca" font-size="14" font-weight="700">100-span object &gt; 256 KiB</text>
      <text x="227" y="596" fill="#f87171" font-size="12">silent reject</text>

      <path d="M372 581 H484" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      <path d="M473 571 L485 581 L473 591" fill="none" stroke="#f59e0b" stroke-width="4"/>
      <text x="428" y="570" fill="#fde68a" font-size="12">batch 50</text>

      <rect x="503" y="558" width="252" height="46" rx="12" fill="#042f2e" stroke="#2dd4bf"/>
      <text x="629" y="578" fill="#ccfbf1" font-size="14" font-weight="700">50-span objects × 2</text>
      <text x="629" y="596" fill="#5eead4" font-size="12">each &lt; 256 KiB</text>

      <path d="M774 581 H858" stroke="#64748b" stroke-width="3"/>
      <path d="M847 571 L859 581 L847 591" fill="none" stroke="#64748b" stroke-width="3"/>

      <rect x="877" y="558" width="221" height="46" rx="12" fill="#064e3b" stroke="#2dd4bf"/>
      <text x="987" y="578" fill="#ecfeff" font-size="14" font-weight="700">durable → relaunch</text>
      <text x="987" y="596" fill="#99f6e4" font-size="12">exact 100 / 100</text>
    </g>

    <text x="600" y="653" fill="#64748b" font-size="13" text-anchor="middle">50も普遍的な安全値ではない。production contractにはbyte-aware policyとoversize可視化が必要</text>
  </g>
</svg>
