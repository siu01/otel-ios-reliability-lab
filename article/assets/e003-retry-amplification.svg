<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">E003 retry amplification matrix</title>
  <desc id="description">Grouped bars show zero, one, two, and two completed HTTP failures producing one, two, three, and three delivered copies at four, six, eight, and ten second Collector delays.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d2b"/>
      <stop offset="1" stop-color="#03070c"/>
    </linearGradient>
    <linearGradient id="delivery" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="failure" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <circle cx="1060" cy="90" r="180" fill="#2dd4bf" opacity="0.06"/>
  <circle cx="120" cy="620" r="210" fill="#f97316" opacity="0.05"/>

  <text x="76" y="82" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700">失敗が1回増えると、同じSpanも1コピー増えた</text>
  <text x="77" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19">E003 • Instant persistence • explicit flushなし • 100 logical spans</text>

  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <line x1="118" y1="510" x2="1120" y2="510" stroke="#475569" stroke-width="2"/>
    <line x1="118" y1="410" x2="1120" y2="410" stroke="#334155" stroke-width="1" stroke-dasharray="6 8"/>
    <line x1="118" y1="310" x2="1120" y2="310" stroke="#334155" stroke-width="1" stroke-dasharray="6 8"/>
    <line x1="118" y1="210" x2="1120" y2="210" stroke="#334155" stroke-width="1" stroke-dasharray="6 8"/>

    <g fill="#94a3b8" font-size="16" text-anchor="end">
      <text x="102" y="516">0</text>
      <text x="102" y="416">1</text>
      <text x="102" y="316">2</text>
      <text x="102" y="216">3</text>
    </g>

    <!-- 4 seconds: failures 0, delivery 1x -->
    <rect x="224" y="506" width="58" height="4" rx="2" fill="url(#failure)"/>
    <rect x="294" y="410" width="58" height="100" rx="10" fill="url(#delivery)" filter="url(#glow)"/>
    <text x="253" y="490" fill="#fdba74" font-size="20" font-weight="700" text-anchor="middle">0</text>
    <text x="323" y="394" fill="#99f6e4" font-size="22" font-weight="700" text-anchor="middle">1x</text>

    <!-- 6 seconds: failures 1, delivery 2x -->
    <rect x="454" y="410" width="58" height="100" rx="10" fill="url(#failure)"/>
    <rect x="524" y="310" width="58" height="200" rx="10" fill="url(#delivery)" filter="url(#glow)"/>
    <text x="483" y="394" fill="#fdba74" font-size="20" font-weight="700" text-anchor="middle">1</text>
    <text x="553" y="294" fill="#99f6e4" font-size="22" font-weight="700" text-anchor="middle">2x</text>

    <!-- 8 seconds: failures 2, delivery 3x -->
    <rect x="684" y="310" width="58" height="200" rx="10" fill="url(#failure)"/>
    <rect x="754" y="210" width="58" height="300" rx="10" fill="url(#delivery)" filter="url(#glow)"/>
    <text x="713" y="294" fill="#fdba74" font-size="20" font-weight="700" text-anchor="middle">2</text>
    <text x="783" y="194" fill="#99f6e4" font-size="22" font-weight="700" text-anchor="middle">3x</text>

    <!-- 10 seconds: failures 2, delivery 3x -->
    <rect x="914" y="310" width="58" height="200" rx="10" fill="url(#failure)"/>
    <rect x="984" y="210" width="58" height="300" rx="10" fill="url(#delivery)" filter="url(#glow)"/>
    <text x="943" y="294" fill="#fdba74" font-size="20" font-weight="700" text-anchor="middle">2</text>
    <text x="1013" y="194" fill="#99f6e4" font-size="22" font-weight="700" text-anchor="middle">3x</text>

    <g fill="#cbd5e1" font-size="19" font-weight="600" text-anchor="middle">
      <text x="288" y="548">4秒</text>
      <text x="518" y="548">6秒</text>
      <text x="748" y="548">8秒</text>
      <text x="978" y="548">10秒</text>
    </g>
    <text x="618" y="584" fill="#94a3b8" font-size="17" text-anchor="middle">Collectorを起動するまでの時間</text>

    <rect x="255" y="616" width="18" height="18" rx="4" fill="url(#failure)"/>
    <text x="285" y="631" fill="#cbd5e1" font-size="16">成功前に完了したHTTP失敗</text>
    <rect x="594" y="616" width="18" height="18" rx="4" fill="url(#delivery)"/>
    <text x="624" y="631" fill="#cbd5e1" font-size="16">各logical Spanの配送倍率</text>
  </g>
</svg>
