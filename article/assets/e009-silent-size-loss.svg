<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">E009 silent persistence object-size loss</title>
  <desc id="description">Provider force flush reports completion, but both persistence presets recover one hundred of one hundred at a one hundred span workload, zero of five hundred, and only the final two hundred thirty-two of one thousand because count-sized export chunks cross a two hundred fifty-six KiB persistence object limit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d2b"/>
      <stop offset="1" stop-color="#03070c"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="1125" cy="60" r="185" fill="#f59e0b" opacity="0.045"/>
  <circle cx="75" cy="630" r="190" fill="#ef4444" opacity="0.045"/>

  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="70" y="72" fill="#f8fafc" font-size="34" font-weight="750">forceFlush完了。でも500件は0件だった</text>
    <text x="71" y="110" fill="#94a3b8" font-size="18">E009 • background flush • Default / Instantで同じ境界</text>

    <!-- outcome panel -->
    <rect x="70" y="146" width="474" height="391" rx="22" fill="#0f172a" stroke="#334155"/>
    <text x="101" y="187" fill="#e2e8f0" font-size="21" font-weight="700">再起動後に回収できたSpan</text>
    <text x="101" y="214" fill="#64748b" font-size="14">両presetとも同じ件数・重複0</text>

    <!-- 100 -->
    <text x="102" y="268" fill="#cbd5e1" font-size="19" font-weight="700">100件</text>
    <rect x="185" y="242" width="314" height="36" rx="10" fill="#1e293b"/>
    <rect x="185" y="242" width="314" height="36" rx="10" fill="url(#ok)"/>
    <text x="486" y="268" fill="#ecfeff" font-size="20" font-weight="800" text-anchor="end">100 / 100</text>

    <!-- 500 -->
    <text x="102" y="355" fill="#cbd5e1" font-size="19" font-weight="700">500件</text>
    <rect x="185" y="329" width="314" height="36" rx="10" fill="#1e293b"/>
    <line x1="191" y1="335" x2="493" y2="359" stroke="#ef4444" stroke-width="4" opacity="0.75"/>
    <line x1="493" y1="335" x2="191" y2="359" stroke="#ef4444" stroke-width="4" opacity="0.75"/>
    <text x="486" y="355" fill="#fecaca" font-size="20" font-weight="800" text-anchor="end">0 / 500</text>

    <!-- 1000 -->
    <text x="102" y="442" fill="#cbd5e1" font-size="19" font-weight="700">1,000件</text>
    <rect x="185" y="416" width="314" height="36" rx="10" fill="#1e293b"/>
    <rect x="185" y="416" width="73" height="36" rx="10" fill="url(#ok)"/>
    <text x="486" y="442" fill="#ccfbf1" font-size="20" font-weight="800" text-anchor="end">232 / 1,000</text>

    <rect x="101" y="482" width="412" height="35" rx="10" fill="#020617" opacity="0.58"/>
    <text x="307" y="505" fill="#fca5a5" font-size="14" text-anchor="middle">flush duration 112–290ms、すべて「完了」扱い</text>

    <!-- mechanism panel -->
    <rect x="575" y="146" width="555" height="391" rx="22" fill="#0f172a" stroke="#334155"/>
    <text x="606" y="187" fill="#e2e8f0" font-size="21" font-weight="700">個数で分割 → byte上限で棄却</text>
    <text x="606" y="214" fill="#94a3b8" font-size="14">maxExportBatchSize = 256 spans ／ maxObjectSize = 256 KiB</text>

    <text x="607" y="268" fill="#cbd5e1" font-size="17" font-weight="700">500 spans</text>
    <rect x="711" y="239" width="172" height="48" rx="12" fill="#450a0a" stroke="#ef4444"/>
    <text x="797" y="261" fill="#fecaca" font-size="16" font-weight="800" text-anchor="middle">256</text>
    <text x="797" y="278" fill="#fca5a5" font-size="12" text-anchor="middle">oversize ✕</text>
    <rect x="896" y="239" width="172" height="48" rx="12" fill="#450a0a" stroke="#ef4444"/>
    <text x="982" y="261" fill="#fecaca" font-size="16" font-weight="800" text-anchor="middle">244</text>
    <text x="982" y="278" fill="#fca5a5" font-size="12" text-anchor="middle">oversize ✕</text>
    <text x="1084" y="270" fill="#fca5a5" font-size="14" font-weight="800">file 0</text>

    <line x1="607" y1="310" x2="1099" y2="310" stroke="#334155"/>
    <text x="607" y="354" fill="#cbd5e1" font-size="17" font-weight="700">1,000 spans</text>
    <g>
      <rect x="711" y="328" width="84" height="62" rx="11" fill="#450a0a" stroke="#ef4444"/>
      <text x="753" y="354" fill="#fecaca" font-size="15" font-weight="800" text-anchor="middle">256</text>
      <text x="753" y="375" fill="#fca5a5" font-size="13" text-anchor="middle">✕</text>
      <rect x="805" y="328" width="84" height="62" rx="11" fill="#450a0a" stroke="#ef4444"/>
      <text x="847" y="354" fill="#fecaca" font-size="15" font-weight="800" text-anchor="middle">256</text>
      <text x="847" y="375" fill="#fca5a5" font-size="13" text-anchor="middle">✕</text>
      <rect x="899" y="328" width="84" height="62" rx="11" fill="#450a0a" stroke="#ef4444"/>
      <text x="941" y="354" fill="#fecaca" font-size="15" font-weight="800" text-anchor="middle">256</text>
      <text x="941" y="375" fill="#fca5a5" font-size="13" text-anchor="middle">✕</text>
      <rect x="993" y="328" width="106" height="62" rx="11" fill="#064e3b" stroke="#2dd4bf" filter="url(#glow)"/>
      <text x="1046" y="354" fill="#ccfbf1" font-size="15" font-weight="800" text-anchor="middle">232</text>
      <text x="1046" y="375" fill="#99f6e4" font-size="13" text-anchor="middle">fits ✓</text>
    </g>

    <path d="M1046 401 V435 H1012" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="844" y="423" width="168" height="46" rx="12" fill="#042f2e" stroke="#2dd4bf"/>
    <text x="928" y="451" fill="#ccfbf1" font-size="15" font-weight="800" text-anchor="middle">file 1 → 232件</text>

    <rect x="606" y="484" width="493" height="34" rx="10" fill="#451a03" opacity="0.72"/>
    <text x="852" y="506" fill="#fde68a" font-size="14" text-anchor="middle">writerがsize errorを握りつぶし、exporterはsuccessを返す</text>

    <!-- bottom conclusion -->
    <rect x="70" y="565" width="1060" height="65" rx="17" fill="#111827" stroke="#475569"/>
    <text x="600" y="592" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">Span数の上限とencoded byte上限は、別の単位</text>
    <text x="600" y="616" fill="#94a3b8" font-size="14" text-anchor="middle">属性が大きくなれば境界はさらに手前へ動く • 256 Spanが普遍的な安全値ではない</text>

    <text x="600" y="655" fill="#64748b" font-size="12" text-anchor="middle">iPhone 17 Simulator / iOS 26.4.1 • opentelemetry-swift 2.5.0 • core 2.5.1</text>
  </g>
</svg>
